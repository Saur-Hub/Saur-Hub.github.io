[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  port = 8888
  targetPort = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# OAuth callback redirect - send to watchlist.html to handle authentication
[[redirects]]
  from = "/"
  to = "/watchlist.html"
  status = 200
  conditions = { Query = { code = [":code"], state = [":state"] } }
